[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vr-fares"
version = "0.1.0"
description = "Read-only official VR Adult Fix fare scanner and static JSON publisher"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.57,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
vr-fares = "vr_fares.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
