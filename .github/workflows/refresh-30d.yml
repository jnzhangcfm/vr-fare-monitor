name: Refresh public 30d VR fares

on:
  schedule:
    # Weekly Monday refresh, 05:43 UTC. Adjust this cron without changing scanner logic.
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vr-fares-static-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner
        run: python -m pip install ./source

      - name: Fetch existing Pages data
        env:
          PAGES_REPOSITORY: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$PAGES_REPOSITORY" gh-pages; then
            git clone --depth 1 --branch gh-pages "$PAGES_REPOSITORY" site
          else
            mkdir site
            git -C site init --initial-branch=gh-pages
            git -C site remote add origin "$PAGES_REPOSITORY"
          fi

      - name: Generate 30d public JSON
        run: |
          touch site/.nojekyll
          python -m vr_fares.static_export --mode 30d --output-dir site/data

      - name: Publish static data
        run: |
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site add .nojekyll data
          if git -C site diff --cached --quiet; then
            exit 0
          fi
          git -C site commit -m "Refresh 30d VR fares"
          git -C site push origin gh-pages
